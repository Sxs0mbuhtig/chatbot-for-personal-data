name: CI & Codecov Upload

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TYPESENSE_URL: http://localhost:8108
      TYPESENSE_API_KEY: xyz_secret_key_123_secret_key_123
      GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Start Typesense Container
      run: |
        docker rm -f typesense-server || true
        mkdir -p typesense-data
        docker run -d --rm \
          --name typesense-server \
          -p 8108:8108 \
          -v "$(pwd)/typesense-data:/data" \
          typesense/typesense:27.1 \
          --data-dir /data \
          --api-key=xyz_secret_key_123_secret_key_123

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov httpx pytest-asyncio

    - name: Wait for Typesense to be Ready
      run: |
        python3 -c "
        import time, urllib.request
        url = 'http://localhost:8108/health'
        headers = {'X-TYPESENSE-API-KEY': 'xyz_secret_key_123_secret_key_123'}
        for i in range(30):
            try:
                req = urllib.request.Request(url, headers=headers)
                with urllib.request.urlopen(req) as resp:
                    if resp.status == 200:
                        print('Typesense is ready!')
                        break
            except Exception:
                print(f'Waiting for Typesense... attempt {i+1}/30')
                time.sleep(2)
        else:
            raise RuntimeError('Typesense failed to start in time')
        "

    - name: Run Pytest with XML Coverage Report
      run: pytest --cov=app --cov=routers --cov=services --cov=schemas --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=75 tests/ -v

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: "${{ secrets.CODECOV_TOKEN }}"
        file: ./coverage.xml
        fail_ci_if_error: true
        verbose: true

    - name: Upload Coverage to Codecov
      if: env.ACT != 'true'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
